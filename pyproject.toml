[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimlens"
version = "0.1.0"
description = "Evidence-based issue and pull request triage assistant"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["src", "examples/sample_project"]
testpaths = ["tests", "examples/sample_project/tests"]
